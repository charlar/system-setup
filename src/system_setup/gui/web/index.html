<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>System Setup</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <nav class="sidebar">
    <div class="brand">System Setup</div>
    <button class="nav active" data-tab="tools" data-i18n="nav.tools"></button>
    <button class="nav" data-tab="wsl" data-i18n="nav.wsl"></button>
    <button class="nav" data-tab="pg" data-i18n="nav.pg"></button>
    <button class="nav" data-tab="mysql" data-i18n="nav.mysql"></button>
    <button class="nav" data-tab="files" data-i18n="nav.files"></button>
    <div class="spacer"></div>
    <div class="lang-switch" role="group" aria-label="Language / Idioma">
      <button data-lang="en">English</button>
      <button data-lang="es">Español</button>
    </div>
    <div class="meta" id="meta"></div>
  </nav>

  <main>
    <div id="banners"></div>

    <!-- Windows tools -->
    <section class="tab" id="tab-tools">
      <header class="tab-head">
        <div>
          <h1 data-i18n="tools.title"></h1>
          <p class="sub" data-i18n="tools.sub"></p>
        </div>
        <button class="btn" id="tools-refresh" data-i18n="btn.refresh"></button>
      </header>
      <div class="list" id="tools-list"></div>
    </section>

    <!-- WSL -->
    <section class="tab hidden" id="tab-wsl">
      <header class="tab-head">
        <div>
          <h1 data-i18n="wsl.title"></h1>
          <p class="sub" data-i18n="wsl.sub"></p>
        </div>
        <button class="btn" id="wsl-refresh" data-i18n="btn.refresh"></button>
      </header>
      <div id="wsl-body"></div>
    </section>

    <!-- PostgreSQL -->
    <section class="tab hidden" id="tab-pg">
      <header class="tab-head">
        <div>
          <h1 data-i18n="pg.title"></h1>
          <p class="sub" data-i18n="pg.sub"></p>
        </div>
        <button class="btn primary" id="pg-add" data-i18n="pg.add"></button>
      </header>
      <div class="list" id="pg-list"></div>
      <div class="files-foot" id="pg-files"></div>
    </section>

    <!-- MySQL -->
    <section class="tab hidden" id="tab-mysql">
      <header class="tab-head">
        <div>
          <h1 data-i18n="my.title"></h1>
          <p class="sub" data-i18n="my.sub"></p>
        </div>
        <button class="btn primary" id="my-add" data-i18n="my.add"></button>
      </header>
      <div class="list" id="my-list"></div>
      <div class="files-foot" id="my-files"></div>
    </section>

    <!-- Files -->
    <section class="tab hidden" id="tab-files">
      <header class="tab-head">
        <div>
          <h1 data-i18n="files.title"></h1>
          <p class="sub" data-i18n="files.sub"></p>
        </div>
      </header>
      <div class="list" id="files-list"></div>
    </section>
  </main>
</div>

<!-- Job log drawer -->
<div class="drawer hidden" id="drawer">
  <div class="drawer-head">
    <span class="dot" id="job-dot"></span>
    <strong id="job-title"></strong>
    <span class="spacer"></span>
    <button class="btn small" id="job-copy" data-i18n="btn.copy_log"></button>
    <button class="btn small" id="job-close" data-i18n="btn.hide"></button>
  </div>
  <pre id="job-log"></pre>
</div>

<!-- Modal -->
<div class="modal-bg hidden" id="modal-bg">
  <form class="modal" id="modal" autocomplete="off">
    <h2 id="modal-title"></h2>
    <div id="modal-body"></div>
    <div class="modal-error" id="modal-error"></div>
    <div class="modal-actions">
      <button type="button" class="btn" id="modal-cancel" data-i18n="btn.cancel"></button>
      <button type="submit" class="btn primary" id="modal-ok"></button>
    </div>
  </form>
</div>

<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
