[project]
name = "system-setup"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
system-setup = "system_setup:main"
psql          = "system_setup.wrappers:psql"
mysql         = "system_setup.wrappers:mysql"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/system_setup"]
